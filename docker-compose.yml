# Локальный запуск панели DankoDeploy.
# Backend в контейнере, фронт собирается отдельно (vite) или раздаётся статикой.
# Для MVP проще запускать `pnpm dev` локально; этот compose — для варианта "в Docker".

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: /app/data/dankodeploy.sqlite
      BACKUP_DIR: /app/backups
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      DANKODEPLOY_MASTER_KEY: ${DANKODEPLOY_MASTER_KEY:?Задайте DANKODEPLOY_MASTER_KEY в .env}
      # HOST=0.0.0.0 нужен внутри контейнера, но порт публикуется ТОЛЬКО на 127.0.0.1
      # хоста (см. ports ниже) — наружу не торчит. Поэтому осознанно разрешаем старт
      # без пароля панели (иначе fail-closed-проверка в config.ts не даст подняться).
      # Перед выносом наружу задайте DANKODEPLOY_AUTH_PASSWORD_HASH и уберите это.
      DANKODEPLOY_ALLOW_NO_AUTH: "true"
    ports:
      # Слушаем только localhost хоста — панель наружу не торчит
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      # Проброс SSH-ключей-агента при необходимости можно добавить здесь
    restart: unless-stopped
