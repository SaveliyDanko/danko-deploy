# nginx фронта DankoDeploy: статика SPA + прокси API/WS на контейнер server.
# Имя "server" резолвится docker-сетью compose (см. docker-compose.yml).

upstream dankodeploy_server {
    server server:3001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API — обычный reverse-proxy.
    location /api/ {
        proxy_pass http://dankodeploy_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Долгие фоновые операции (раскатка, установка) — поднимаем таймауты.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket (/ws): мультиплекс деплой-логов, метрик, веб-терминалов.
    location /ws {
        proxy_pass http://dankodeploy_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Терминалы держат соединение долго — без таймаута по чтению.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA: всё остальное → index.html (клиентский роутинг React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
