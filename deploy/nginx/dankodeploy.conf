# nginx reverse-proxy для DankoDeploy на VPS.
# Один домен: статика фронта + проксирование /api и /ws на backend-контейнер.
# Фронт ходит на тот же origin (относительные /api, /ws — см. apps/web/src/lib),
# поэтому отдельный CORS/WEB_ORIGIN наружу не нужен.
#
# Замените ВАШ-ДОМЕН на реальный и положите сертификаты (Let's Encrypt) в
# смонтированный каталог. В compose имя backend-сервиса — "server", порт 3001.

# HTTP → HTTPS (плюс ACME-челлендж certbot)
server {
    listen 80;
    server_name ВАШ-ДОМЕН;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ВАШ-ДОМЕН;

    ssl_certificate     /etc/letsencrypt/live/ВАШ-ДОМЕН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ВАШ-ДОМЕН/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Веб-терминал = прямой shell. Cookie сессии — только по HTTPS.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Загрузка файлов бэкапов (config import, upload) может быть крупной.
    client_max_body_size 512m;

    # SPA: статика фронта, история React Router → index.html
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Стрим логов деплоя/бэкапа идёт по WS, но SSE/долгие ответы тоже не буферим.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSocket (/ws): метрики, live-логи, веб-терминалы
    location /ws {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Терминалы — долгоживущие соединения, не рвём по таймауту.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
