---
# Доставка кода DankoDeploy на сервер (git clone/pull).

# Каталог создаёт root и сразу отдаёт владельцу — иначе git clone от dankodeploy
# не сможет создать /opt/dankodeploy (родитель /opt принадлежит root).
- name: Создать каталог проекта с владельцем dankodeploy
  ansible.builtin.file:
    path: "{{ dankodeploy_dir }}"
    state: directory
    owner: "{{ dankodeploy_user }}"
    group: "{{ dankodeploy_user }}"
    mode: "0755"

# Под become git проверяет владельца репозитория строже (отдельный HOME/окружение)
# и падает с "detected dubious ownership", даже когда каталог принадлежит dankodeploy.
# Явно помечаем каталог безопасным для пользователя деплоя — идемпотентно.
- name: Пометить каталог проекта как safe.directory для git
  ansible.builtin.command:
    cmd: git config --global --get-all safe.directory
  become_user: "{{ dankodeploy_user }}"
  register: _git_safe_dirs
  changed_when: false
  failed_when: false

- name: Добавить safe.directory для каталога проекта
  ansible.builtin.command:
    cmd: git config --global --add safe.directory {{ dankodeploy_dir }}
  become_user: "{{ dankodeploy_user }}"
  when: dankodeploy_dir not in _git_safe_dirs.stdout_lines

- name: Клонировать/обновить репозиторий DankoDeploy
  ansible.builtin.git:
    repo: "{{ dankodeploy_repo }}"
    dest: "{{ dankodeploy_dir }}"
    version: "{{ dankodeploy_branch }}"
    # Локальные изменения (сгенерированный .env лежит вне git) не трогаем.
    force: false
  become_user: "{{ dankodeploy_user }}"
  notify: rebuild dankodeploy
