---
# Установка Docker Engine + Compose plugin (официальный репозиторий Docker).
# Идемпотентно: при повторном прогоне ничего не переустанавливает.

- name: Установить зависимости apt
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
    state: present
    update_cache: true

- name: Создать каталог для apt-ключей
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Добавить GPG-ключ Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Определить кодовое имя дистрибутива
  ansible.builtin.command: lsb_release -cs
  register: dankodeploy_lsb
  changed_when: false

- name: Добавить apt-репозиторий Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | regex_replace('^x86_64$', 'amd64') | regex_replace('^aarch64$', 'arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ dankodeploy_lsb.stdout }} stable
    state: present
    filename: docker

- name: Установить Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Запустить и включить docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Создать пользователя-владельца DankoDeploy
  ansible.builtin.user:
    name: "{{ dankodeploy_user }}"
    groups: docker
    append: true
    shell: /bin/bash
    create_home: true
