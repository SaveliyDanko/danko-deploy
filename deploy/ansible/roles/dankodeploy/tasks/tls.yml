---
# TLS через Let's Encrypt. Первый выпуск — certbot в standalone (порт 80 свободен,
# nginx ещё не поднят с TLS-конфигом). Идемпотентно: если сертификат уже есть — пропуск.
# Продление — отдельный certbot renew (см. ниже handler/крон).

- name: Проверить наличие сертификата
  ansible.builtin.stat:
    path: "{{ dankodeploy_dir }}/deploy/letsencrypt/live/{{ dankodeploy_domain }}/fullchain.pem"
  register: dankodeploy_cert

- name: Выпустить сертификат Let's Encrypt (standalone, первый раз)
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      -v {{ dankodeploy_dir }}/deploy/letsencrypt:/etc/letsencrypt
      -v {{ dankodeploy_dir }}/deploy/certbot-www:/var/www/certbot
      -p 80:80
      certbot/certbot certonly --standalone
      -d {{ dankodeploy_domain }}
      --agree-tos -m {{ dankodeploy_acme_email }} -n
      {{ '--staging' if dankodeploy_acme_staging | bool else '' }}
    chdir: "{{ dankodeploy_dir }}"
  when: not dankodeploy_cert.stat.exists

- name: Cron — автопродление сертификата (webroot, дважды в день)
  ansible.builtin.cron:
    name: dankodeploy-certbot-renew
    minute: "0"
    hour: "3,15"
    job: >-
      docker run --rm
      -v {{ dankodeploy_dir }}/deploy/letsencrypt:/etc/letsencrypt
      -v {{ dankodeploy_dir }}/deploy/certbot-www:/var/www/certbot
      certbot/certbot renew --webroot -w /var/www/certbot -q
      && docker compose -f {{ dankodeploy_dir }}/{{ dankodeploy_compose_file }} exec web nginx -s reload
