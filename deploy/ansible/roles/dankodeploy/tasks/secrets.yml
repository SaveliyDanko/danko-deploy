---
# Генерация и сохранение секретов. master-key и session-secret генерятся ОДИН раз
# и переживают повторные прогоны (смена master-key = потеря доступа к зашифрованным
# SSH-секретам). Хэш пароля считается самим проектом (pnpm gen-password) — чтобы не
# дублировать scrypt-логику и не разойтись с источником истины.

- name: Каталог для постоянных секретов
  ansible.builtin.file:
    path: "{{ dankodeploy_dir }}/secrets"
    state: directory
    owner: "{{ dankodeploy_user }}"
    group: "{{ dankodeploy_user }}"
    mode: "0700"

# --- master-key (base64, 32 байта): генерим один раз ---
- name: Проверить наличие master-key
  ansible.builtin.stat:
    path: "{{ dankodeploy_dir }}/secrets/master_key"
  register: dankodeploy_master_key_file

- name: Сгенерировать master-key (только при первом прогоне)
  ansible.builtin.shell: "openssl rand -base64 32 > {{ dankodeploy_dir }}/secrets/master_key"
  when: not dankodeploy_master_key_file.stat.exists

- name: Прочитать master-key
  ansible.builtin.slurp:
    src: "{{ dankodeploy_dir }}/secrets/master_key"
  register: dankodeploy_master_key_b64

# --- session-secret (hex, 32 байта): генерим один раз ---
- name: Проверить наличие session-secret
  ansible.builtin.stat:
    path: "{{ dankodeploy_dir }}/secrets/session_secret"
  register: dankodeploy_session_secret_file

- name: Сгенерировать session-secret (только при первом прогоне)
  ansible.builtin.shell: "openssl rand -hex 32 > {{ dankodeploy_dir }}/secrets/session_secret"
  when: not dankodeploy_session_secret_file.stat.exists

- name: Прочитать session-secret
  ansible.builtin.slurp:
    src: "{{ dankodeploy_dir }}/secrets/session_secret"
  register: dankodeploy_session_secret_b64

# --- хэш пароля панели: считаем самим проектом в одноразовом контейнере ---
# Сначала нужен собранный образ сервера — собираем его (build кешируется).
- name: Собрать образ backend (для gen-password и запуска)
  ansible.builtin.command:
    cmd: docker compose -f {{ dankodeploy_compose_file }} build server
    chdir: "{{ dankodeploy_dir }}"
  become_user: "{{ dankodeploy_user }}"
  changed_when: false

- name: Сгенерировать scrypt-хэш пароля панели (через сам проект)
  ansible.builtin.command:
    # Сервер собран в бандл (esbuild); хэш считает собранный dist/genPassword.js
    # тем же scrypt, что и панель. cwd контейнера — /app, путь скрипта от него.
    cmd: >-
      docker compose -f {{ dankodeploy_compose_file }} run --rm --no-deps
      --entrypoint node server apps/server/dist/genPassword.js
      {{ dankodeploy_panel_password }}
    chdir: "{{ dankodeploy_dir }}"
  become_user: "{{ dankodeploy_user }}"
  register: dankodeploy_gen_password
  changed_when: false
  no_log: true

- name: Извлечь хэш пароля из вывода
  ansible.builtin.set_fact:
    # Формат хэша — "scrypt$<N>$<salt>$<hash>" (см. core/crypto.ts hashPassword),
    # поэтому захватываем всё значение до конца строки (\S+), а не только hex.
    # Ищем в stdout И stderr: docker compose (плагин v2 из apt) маршрутизирует
    # вывод контейнера из `run` в stderr — строки может не быть в stdout.
    # default([''], true) вместо падения с невнятным "'NoneType' object is not
    # iterable", если строки нет нигде; пустой хэш ловит следующая проверка.
    dankodeploy_password_hash: >-
      {{ (dankodeploy_gen_password.stdout ~ '\n' ~ dankodeploy_gen_password.stderr)
         | regex_search('DANKODEPLOY_AUTH_PASSWORD_HASH=(\S+)', '\1')
         | default([''], true) | first }}
  no_log: true

- name: Проверить, что хэш пароля извлечён
  ansible.builtin.assert:
    that: dankodeploy_password_hash | length > 0
    fail_msg: >-
      Не удалось извлечь DANKODEPLOY_AUTH_PASSWORD_HASH из вывода gen-password
      (rc={{ dankodeploy_gen_password.rc }},
       stdout={{ dankodeploy_gen_password.stdout | length }} симв.,
       stderr={{ dankodeploy_gen_password.stderr | length }} симв.).
      Проверьте сборку образа server и наличие dist/genPassword.js.
  # no_log НЕ ставим: в сообщение идут только длины потоков и rc, не сам хэш.

- name: Собрать .env из шаблона
  ansible.builtin.template:
    src: env.j2
    dest: "{{ dankodeploy_dir }}/.env"
    owner: "{{ dankodeploy_user }}"
    group: "{{ dankodeploy_user }}"
    mode: "0600"
  no_log: true
  notify: restart dankodeploy
