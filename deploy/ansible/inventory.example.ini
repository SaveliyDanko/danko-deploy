# Скопируйте в inventory.ini и впишите свой VPS.
# Минимум — адрес сервера и SSH-пользователь с sudo.

[dankodeploy]
stand ansible_host=ВАШ_VPS_IP ansible_user=root

# Если не root — укажите пользователя с sudo и при необходимости ключ:
#   stand ansible_host=1.2.3.4 ansible_user=deploy ansible_ssh_private_key_file=~/.ssh/id_ed25519
